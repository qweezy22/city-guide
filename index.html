<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Мини-гид по городу Киров</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="menuPanel">

    <div id="menu">

        <button id="backButton" onclick="goBack()" style="display:none;">
            <span class="back-icon"></span>
        </button>

        <div id="searchWrapper" style="display:none; margin-bottom:12px;">
            <input id="searchInput" type="text" placeholder="Поиск мест..." oninput="searchPlaces(this.value)" />
        </div>

        <div id="interesting" class="screen">
            <h2 id="interestingTitle">Интересные места</h2>
        </div>

        <div id="menuContent">

        </div>
        
        <div id="welcome" class="screen active">

                <button id="langToggle" onclick="toggleLanguage()">
                    EN
                </button>

               <h2>Мини-гид по Кирову</h2>

               <p>
                   Выберите категорию
                   и откройте интересные места города.
               </p>

               <button id="welcomeButton" onclick="openMainMenu()">
                    В путешествие →
               </button>

       </div>

        <div id="mainMenu" class="screen">

            <button class="menu-btn" onclick="openInterestingPlaces()">

                <div class="menu-bg interesting-btn"></div>

                <span>Интересные места</span>

            </button>

            <button class="menu-btn" onclick="openRoutePlanner()">

                <div class="menu-bg route-btn"></div>

                <span>Планы маршрутов</span>

            </button>

            <button class="menu-btn" onclick="openCategories()">

                <div class="menu-bg">

                    <div class="menu-carousel-track" id="categoriesCarousel">

                        <img src="images/Cat-nature.jpg">
                        <img src="images/Cat-cult.jpg">
                        <img src="images/Cat-fun.jpg">

                    </div>

                </div>

                <span>Категории</span>

            </button>

            <button class="menu-btn" onclick="openStudents()">

                <div class="menu-bg students-btn"></div>

                <span>Студентам</span>

            </button>

        </div>

        <div id="categories" class="screen">

            <h2>Категории</h2>

            <button onclick="showAll(this)">
                Показать все
            </button>

            <button onclick="showCategory('tradecenters', this)">
                Торговый центр
            </button>

            <button onclick="showCategory('food', this)">
                Еда
            </button>

            <button onclick="showCategory('nature', this)">
                Природа
            </button>

            <button onclick="showCategory('water', this)">
                Реки и озёра
            </button>

            <button onclick="showCategory('cave', this)">
                Пещеры и скалы
            </button>

            <button onclick="showCategory('spring', this)">
                Родники
            </button>

            <button onclick="showCategory('history', this)">
                История
            </button>

            <button onclick="showCategory('museums', this)">
                Музеи и театры
            </button>

            <button onclick="showCategory('park', this)">
                Природные комплексы
            </button>

            <button onclick="showCategory('kids', this)">
                Для детей
            </button>

        </div>

        <div id="students" class="screen">

            <h2 id="studentsTitle">
                Студентам
            </h2>

            <button onclick="showCategory('print', this, 'students')">
                Печать
            </button>

            <div class="education-wrapper">

                <button class="education-main"
                    onclick="toggleEducation(this)">

                    Образование ▶

                </button>

            </div>

            <button onclick="showCategory('food', this, 'students')">
                Где поесть
            </button>

        </div>

        <div id="placesList"></div>
        <div id="placeDetails" class="screen">

            <div class="place-details-container">

                <div id="photoCarousel" class="carousel"></div>

                <h2 id="placeTitle"></h2>

                <p id="placeDescription"></p>

                <button id="routeButton">
                    Построить маршрут
                </button>

                <h3 id="reviewsTitle">Отзывы</h3>

                <div id="reviews">
                    Пока отзывов нет
                </div>
                <div id="placeRating" style="margin-top:10px;"></div>

            </div>

        </div>

    <div id="routePlanner" class="screen" style="display:none;">

        <h2 id="routePlannerTitle">
            Планы маршрутов
        </h2>

        <p id="routePlannerText">
            Выберите готовый план маршрута для туристов:
        </p>

        <button id="routeHour" onclick="openRoutePlan('hour')">
            Маршрут на час
        </button>

        <button id="routeKids" onclick="openRoutePlan('kids')">
            Маршрут с детьми
        </button>

        <button id="routeWalking" onclick="openRoutePlan('walking')">
            Пешеходный маршрут
        </button>

        <button id="routeCulture" onclick="openRoutePlan('culture')">
            Культурный маршрут
        </button>

        <button id="routePhoto" onclick="openRoutePlan('photo')">
            Фото-маршрут
        </button>

        <div id="routePlanDetails"
            style="margin-top:12px; display:none;">
        </div>

    </div>

    </div>

        <div id="map"></div>
        <button id="menuToggleBtn">
            <span>▲</span>
        </button>

        <script src="https://api-maps.yandex.ru/2.1/?apikey=65ec81d2-94f4-4f40-adc4-f205e32ee9bb&lang=ru_RU"></script>
        <script src="places.js"></script>
        <script src="script.js"></script>

</body>
</html>
